<div style="padding: 20px; font-family: Arial, sans-serif; max-width: 1000px; margin: auto;">
  <h1>🛍️ E-Commerce Product Store</h1>

  <!-- Alerts -->
  <div *ngIf="errorMessage" style="color: red; margin-bottom: 15px; padding: 10px; background: #ffe6e6; border-radius: 5px;">
    {{ errorMessage }}
  </div>
  <div *ngIf="successMessage" style="color: green; margin-bottom: 15px; padding: 10px; background: #e6ffed; border-radius: 5px;">
    {{ successMessage }}
  </div>

  <!-- Add Product Form -->
  <div style="background: #f9f9f9; padding: 20px; border-radius: 8px; margin-bottom: 30px; border: 1px solid #ddd;">
    <h2>Add New Product</h2>
    <form (ngSubmit)="onSubmit()" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
      
      <div>
        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Product Name:</label>
        <input type="text" [(ngModel)]="newProduct.name" name="name" required style="width: 100%; padding: 8px; box-sizing: border-box;" placeholder="e.g. Mechanical Keyboard">
      </div>

      <div>
        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Category:</label>
        <input type="text" [(ngModel)]="newProduct.category" name="category" required style="width: 100%; padding: 8px; box-sizing: border-box;" placeholder="e.g. Electronics">
      </div>

      <div>
        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Price (₹):</label>
        <input type="number" [(ngModel)]="newProduct.price" name="price" required style="width: 100%; padding: 8px; box-sizing: border-box;" placeholder="e.g. 2500">
      </div>

      <div>
        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Image URL:</label>
        <input type="text" [(ngModel)]="newProduct.imageUrl" name="imageUrl" style="width: 100%; padding: 8px; box-sizing: border-box;" placeholder="https://example.com/image.jpg">
      </div>

      <div style="grid-column: span 2;">
        <label style="display: block; margin-bottom: 5px; font-weight: bold;">Description:</label>
        <textarea [(ngModel)]="newProduct.description" name="description" rows="3" style="width: 100%; padding: 8px; box-sizing: border-box;" placeholder="Write a short description..."></textarea>
      </div>

      <div style="grid-column: span 2;">
        <button type="submit" style="background: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer;">
          Add Product
        </button>
      </div>
    </form>
  </div>

  <!-- Product List Grid -->
  <h2>Product List</h2>
  <div style="display: flex; flex-wrap: wrap; gap: 20px;">
    <div *ngFor="let product of products" style="border: 1px solid #ddd; padding: 15px; border-radius: 8px; width: 220px; box-shadow: 2px 2px 8px rgba(0,0,0,0.1); background: #fff; display: flex; flex-direction: column; justify-content: space-between;">
      
      <div>
        <!-- Product Image with fallback placeholder -->
        <img [src]="product.imageUrl || 'https://via.placeholder.com/200x140?text=No+Image'" 
             alt="{{ product.name }}" 
             style="width: 100%; height: 140px; object-fit: cover; border-radius: 4px; margin-bottom: 10px;">

        <h3 style="margin-top: 0; font-size: 18px;">{{ product.name }}</h3>
        <p style="color: #666; font-size: 14px; margin: 5px 0;">{{ product.description }}</p>
        <p style="font-weight: bold; color: green; margin: 5px 0;">₹{{ product.price }}</p>
        <p style="font-size: 12px; background: #eee; padding: 4px 6px; display: inline-block; border-radius: 4px;">Category: {{ product.category }}</p>
      </div>

      <!-- Delete Button -->
      <button (click)="deleteProduct(product._id || product.id)" style="background: #dc3545; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; margin-top: 10px; font-size: 14px;">
        Delete
      </button>
    </div>
  </div>

  <div *ngIf="products.length === 0" style="margin-top: 20px; color: #555;">
    No products found in database. Add one above!
  </div>
</div>
